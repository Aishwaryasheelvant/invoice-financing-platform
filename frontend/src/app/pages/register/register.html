<div class="page auth-page">
  <div class="card">
    <h2>Register</h2>

    @if (registeredEmail()) {
      <p class="muted">
        Account created for <strong>{{ registeredEmail() }}</strong>. You can now
        <a routerLink="/login">log in</a>.
      </p>
    } @else {
      <form [formGroup]="form" (ngSubmit)="submit()">
        <div class="form-group">
          <label for="email">Email</label>
          <input id="email" type="email" formControlName="email" autocomplete="email" />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input id="password" type="password" formControlName="password" autocomplete="new-password" />
          <span class="muted">At least 10 characters, with an uppercase letter, lowercase letter, and a number.</span>
        </div>

        <div class="form-group">
          <label for="role">I am a...</label>
          <select id="role" formControlName="role">
            @for (role of roles; track role.value) {
              <option [value]="role.value">{{ role.label }}</option>
            }
          </select>
        </div>

        <div class="form-group">
          <label for="companyName">Company name</label>
          <input id="companyName" type="text" formControlName="companyName" />
        </div>

        @if (errorMessage()) {
          <p class="error-text">{{ errorMessage() }}</p>
        }

        <button type="submit" [disabled]="form.invalid || submitting()">
          {{ submitting() ? 'Creating account...' : 'Register' }}
        </button>
      </form>

      <p class="muted" style="margin-top: 16px;">
        Already have an account? <a routerLink="/login">Log in</a>
      </p>
    }
  </div>
</div>
