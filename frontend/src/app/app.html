@if (authService.isLoggedIn()) {
  <nav class="top-nav">
    <div class="brand">
      <span class="brand-mark">IF</span>
      <span>Invoice Financing</span>
    </div>
    <div class="nav-identity">
      <span>{{ authService.currentUser()?.companyName }}</span>
      <span class="badge role">{{ authService.currentUser()?.role }}</span>
      <button class="secondary small" (click)="logout()">Log out</button>
    </div>
  </nav>
}

<router-outlet></router-outlet>
